# The cookware this kitchen has, and what a recipe should call it.
# Left of the "=" is the name that goes in a recipe; everything right of it is
# another name for the same thing, folded onto the left one. Imports are handed
# the left-hand names.
#
# `./tools/ai_import.py cookware` flags any recipe using a name that is not on
# this list, or one under [missing] — gear we do not own, so the recipe needs a
# way round it before it can be cooked here. Hand-editable: move a line between
# sections when the kitchen changes.

[appliance]
oven              = furnace, four
air fryer         = air-fryer, airfryer
slow cooker       = crockpot, crock pot
pressure cooker   = instant pot, instant cooker, multicooker
kettle
microwave
rice cooker       = ricecooker

[pan]
frying pan        = skillet, non-stick frying pan, pan, crêpe pan, crepe pan
saucepan          = small saucepan, milk pan
pot               = large pot, stockpot, casserole, casserole dish
wok
baking tray       = oven tray, sheet pan, baking sheet
baking dish       = oven dish, roasting tin, roasting tray

[kitchen]
bowl              = large bowl, mixing bowl, small bowl, heatproof bowl
plate
jar
measuring jug     = jug
lid
sieve             = colander, strainer, fine sieve
grater
tongs
spatula           = fish slice
ladle
skewers           = skewer
stick blender     = immersion blender, hand blender
pestle and mortar = mortar and pestle

[away]
# not in the kitchen, but reachable: New Zealand parks and beaches keep free public
# barbecues, so a recipe wanting one is a trip out rather than a recipe to adapt
grill             = barbecue, bbq, public bbq

[missing]
# gear we do not have; a recipe wanting one of these needs adapting
griddle           = griddle pan
food processor    = blender, jug blender
stand mixer
deep fryer
