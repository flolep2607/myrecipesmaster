# What's in the kitchen; cook shopping-list subtracts it (--ignore-pantry for the full list).
# Quantities are generous stand-ins for "there's some in the cupboard", and they must be in
# the same unit the recipes use — a pantry in ml does not cover a recipe in tbsp.
# `cook pantry add pantry "<name>" --quantity "50%tbsp"` appends here.

