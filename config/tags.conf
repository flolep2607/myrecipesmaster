# The tags a recipe may carry. Anything not on this list does not go in a recipe.
#
# Rules
#   - lowercase, singular, hyphenated: stir-fry, not Stir Fries
#   - two to five tags, no more
#   - nothing that another metadata key already says: no time tags (`time:`),
#     no course tags (`course:`), no cuisine tags (`cuisine:`)
#   - a tag earns its place by being something you would search for

[effort]
quick            # 20 minutes or less, start to plate
one-pan          # one pan or pot, including the rice
make-ahead       # keeps or improves overnight
batch            # scales up for the week
no-cook

[method]
baked
roasted
fried
stir-fry
grilled
